<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENT CARS - نظام إدارة تأجير السيارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase Official Client Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #1062FE;
  --primary-hover: #004BD6;
  --primary-light: rgba(16, 98, 254, 0.08);
  --accent: #00B67A;
  --accent-light: rgba(0, 182, 122, 0.1);
  --warning: #F59E0B;
  --warning-light: rgba(245, 158, 11, 0.1);
  --danger: #EF4444;
  --danger-light: rgba(239, 68, 68, 0.1);
  --info: #06B6D4;
  --info-light: rgba(6, 182, 212, 0.1);
  --bg-body: #F4F6F9;
  --bg-surface: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-subtle: #F8FAFC;
  --bg-input: #FFFFFF;
  --border-color: #E2E8F0;
  --text-main: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --sidebar-w: 260px;
  --topbar-h: 65px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 22px rgba(16, 98, 254, 0.08);
}
[data-theme="dark"] {
  --bg-body: #0B1120;
  --bg-surface: #131C31;
  --bg-card: #18233C;
  --bg-subtle: #1E2B4A;
  --bg-input: #151F36;
  --border-color: #273656;
  --text-main: #F8FAFC;
  --text-secondary: #CBD5E1;
  --text-muted: #64748B;
  --shadow-hover: 0 8px 22px rgba(0, 0, 0, 0.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background-color: var(--bg-body);
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.5;
  transition: background-color 0.2s ease, color 0.2s ease;
}
body[dir="ltr"] { font-family: 'Inter', sans-serif; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.app-container { display: flex; min-height: 100vh; }
.app-sidebar {
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-inline-end: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; inset-inline-start: 0;
  z-index: 100;
  transition: transform 0.25s ease;
}
.sidebar-header {
  height: var(--topbar-h);
  padding: 0 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
}
.brand-wrapper { display: flex; align-items: center; gap: 0.75rem; font-weight: 800; font-size: 1.15rem; color: var(--text-main); }
.brand-icon {
  width: 38px; height: 38px; border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), #003dbb);
  display: flex; align-items: center; justify-content: center; color: #FFF;
}
.sidebar-nav { flex: 1; overflow-y: auto; padding: 0.75rem; list-style: none; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.65rem 0.85rem; border-radius: var(--radius-md);
  color: var(--text-secondary); font-weight: 600; cursor: pointer; margin-bottom: 2px;
  transition: all 0.15s ease;
}
.nav-item:hover { background: var(--bg-subtle); color: var(--primary); }
.nav-item.active { background: var(--primary); color: #FFF !important; }
.nav-item.active svg { stroke: #FFF !important; }
.nav-item-left { display: flex; align-items: center; gap: 0.75rem; }
.app-main {
  flex: 1; margin-inline-start: var(--sidebar-w);
  display: flex; flex-direction: column; min-height: 100vh;
}
.app-topbar {
  height: var(--topbar-h); background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 90;
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
.btn-icon-top {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border-color);
  background: var(--bg-subtle); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary); transition: all 0.2s ease;
}
.btn-icon-top:hover { border-color: var(--primary); color: var(--primary); }
.global-search {
  width: 280px; height: 38px; background: var(--bg-subtle);
  border: 1px solid var(--border-color); border-radius: 20px; padding: 0 1rem;
  transition: all 0.2s ease;
}
.global-search:focus { outline: none; border-color: var(--primary); width: 320px; }
.page-content { padding: 1.5rem; flex: 1; }
.card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; overflow: hidden;
  transition: box-shadow 0.2s ease;
}
.card:hover { box-shadow: var(--shadow-hover); }
.card-header {
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.card-body { padding: 1.25rem; }
.grid { display: grid; gap: 1.25rem; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

/* DASHBOARD & STAT CARDS */
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 1.25rem; display: flex;
  align-items: center; justify-content: space-between; position: relative;
  overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-card::after {
  content: ''; position: absolute; bottom: 0; inset-inline-start: 0; width: 100%; height: 3px;
  background: var(--card-accent, var(--primary)); opacity: 0.75;
}
.stat-info span.title-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
.stat-info h3 { font-size: 1.6rem; font-weight: 800; margin: 0.25rem 0; line-height: 1.2; }
.stat-trend { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.75rem; font-weight: 700; border-radius: 6px; padding: 0.15rem 0.45rem; }
.stat-trend.up { background: var(--accent-light); color: var(--accent); }
.stat-trend.warn { background: var(--warning-light); color: var(--warning); }
.stat-trend.neutral { background: var(--bg-subtle); color: var(--text-muted); }
.stat-icon {
  width: 48px; height: 48px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
}

/* QUICK ACTIONS BAR */
.quick-actions-bar {
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.25rem;
}
.quick-btn {
  background: var(--bg-surface); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 0.65rem 1rem; display: inline-flex;
  align-items: center; gap: 0.6rem; font-weight: 700; font-size: 0.82rem;
  color: var(--text-main); cursor: pointer; transition: all 0.2s ease;
}
.quick-btn:hover {
  background: var(--bg-subtle); border-color: var(--primary);
  color: var(--primary); transform: translateY(-1px);
}
.quick-btn .btn-badge {
  background: var(--primary-light); color: var(--primary);
  padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.7rem; font-weight: 800;
}

/* FLEET OCCUPANCY BAR */
.fleet-progress-track {
  height: 12px; border-radius: 99px; background: var(--border-color);
  display: flex; overflow: hidden; margin: 0.75rem 0 1rem;
}
.progress-seg { height: 100%; transition: width 0.3s ease; }

/* ALERT BANNER */
.alert-card {
  border-radius: var(--radius-md); padding: 0.75rem 1rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  margin-bottom: 0.75rem; font-size: 0.82rem; font-weight: 600;
}
.alert-card.danger { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
.alert-card.warning { background: var(--warning-light); color: #B45309; border: 1px solid rgba(245, 158, 11, 0.25); }
.alert-card.info { background: var(--info-light); color: var(--info); border: 1px solid rgba(6, 182, 212, 0.2); }

.table-responsive { width: 100%; overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; text-align: start; }
.data-table th {
  background: var(--bg-subtle); color: var(--text-secondary);
  font-weight: 700; font-size: 0.8rem; padding: 0.75rem 1rem; border-bottom: 2px solid var(--border-color);
}
.data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
.data-table tbody tr:hover { background: var(--bg-subtle); }
.badge { display: inline-flex; align-items: center; padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; gap: 0.25rem; }
.badge-success { background: var(--accent-light); color: var(--accent); }
.badge-warning { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-primary { background: var(--primary-light); color: var(--primary); }
.badge-secondary { background: var(--bg-subtle); color: var(--text-secondary); }
.badge-info { background: var(--info-light); color: var(--info); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  font-weight: 700; font-size: 0.82rem; padding: 0.55rem 1.15rem; border-radius: var(--radius-md);
  cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease;
}
.btn-primary { background: var(--primary); color: #FFF; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--bg-subtle); color: var(--text-secondary); border-color: var(--border-color); }
.btn-secondary:hover { background: var(--border-color); }
.btn-accent { background: var(--accent); color: #FFF; }
.btn-accent:hover { filter: brightness(0.92); }
.btn-danger { background: var(--danger); color: #FFF; }
.btn-danger:hover { filter: brightness(0.92); }
.btn-sm { padding: 0.35rem 0.65rem; font-size: 0.75rem; }
.btn-icon { width: 32px; height: 32px; padding: 0; }
.form-group { margin-bottom: 1rem; }
.form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--text-secondary); }
.form-control {
  width: 100%; height: 38px; background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 0.4rem 0.75rem; font-size: 0.85rem; color: var(--text-main);
  transition: border-color 0.2s ease;
}
.form-control:focus { outline: none; border-color: var(--primary); }
textarea.form-control { height: auto; min-height: 75px; }
.filter-bar {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 0.85rem 1.25rem; margin-bottom: 1.25rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center;
  justify-content: center; padding: 1.5rem; opacity: 0; visibility: hidden; transition: 0.2s ease;
}
.modal-backdrop.show { opacity: 1; visibility: visible; }
.modal-dialog {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); width: 100%; max-width: 600px;
  max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
.modal-dialog.lg { max-width: 860px; }
.modal-header { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 1.25rem; overflow-y: auto; }
.modal-footer { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); background: var(--bg-subtle); display: flex; justify-content: flex-end; gap: 0.5rem; }
.vehicle-grid-card {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
  overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}
.vehicle-grid-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.vehicle-grid-card img { width: 100%; height: 160px; object-fit: cover; background: var(--bg-subtle); }
.vehicle-grid-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

/* LOGIN SCREEN OVERLAY */
.login-screen-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(11, 17, 32, 0.65);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex; align-items: center; justify-content: center; padding: 1.5rem;
}
.login-card {
  width: 100%; max-width: 440px; background: var(--bg-card);
  border: 1px solid var(--border-color); border-radius: 18px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35); padding: 2.2rem 2rem;
  display: flex; flex-direction: column; position: relative;
}
.login-brand-header {
  display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.8rem;
}
.login-brand-logo {
  width: 58px; height: 58px; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), #003dbb);
  display: flex; align-items: center; justify-content: center; color: #FFF;
  margin-bottom: 0.8rem; box-shadow: 0 6px 16px rgba(16, 98, 254, 0.3);
}
.login-input-group { margin-bottom: 1.15rem; }
.login-input-group label {
  display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem;
}
.login-input-wrap {
  position: relative; display: flex; align-items: center;
}
.login-input-wrap span.input-icon {
  position: absolute; inset-inline-start: 12px; font-size: 1.05rem; color: var(--text-muted);
}
.login-input-wrap input, .login-input-wrap select {
  padding-inline-start: 38px; height: 42px; border-radius: 10px;
}
/* Visual input error state & shake animation */
.login-input-wrap input.input-error {
  border-color: var(--danger) !important;
  background-color: var(--danger-light) !important;
}
.login-error-msg {
  display: none;
  background: var(--danger-light);
  color: var(--danger);
  border: 1px solid rgba(239, 68, 68, 0.25);
  padding: 0.55rem 0.8rem;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 700;
  margin-bottom: 1rem;
  align-items: center;
  gap: 0.4rem;
}
@keyframes loginShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
.shake-anim {
  animation: loginShake 0.35s ease-in-out;
}

/* RESPONSIVE OPTIMIZATIONS FOR MOBILE & IPAD / TABLET */
.mobile-bottom-nav {
  display: none;
}

@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .stat-card { padding: 1rem; }
  .stat-info h3 { font-size: 1.35rem; }
  .quick-actions-bar { gap: 0.5rem; }
  .quick-btn { padding: 0.5rem 0.8rem; font-size: 0.78rem; }
  .modal-dialog.lg { max-width: 95vw; }
}

@media (max-width: 768px) {
  .app-sidebar { 
    transform: translateX(100%); 
    box-shadow: -5px 0 25px rgba(0,0,0,0.25);
  }
  body[dir="ltr"] .app-sidebar { transform: translateX(-100%); }
  .app-sidebar.open { transform: translateX(0) !important; }
  .app-main { 
    margin-inline-start: 0; 
    padding-bottom: 70px; /* Space for bottom mobile nav */
  }
  .app-topbar { padding: 0 1rem; }
  .page-content { padding: 1rem 0.85rem; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr !important; }
  .global-search { display: none; }
  #topbarLogoutBtn { display: none; }
  .modal-dialog {
    width: 96vw;
    margin: 0.5rem auto;
    max-height: 94vh;
  }
  .modal-header, .modal-body, .modal-footer {
    padding: 0.9rem;
  }
  .modal-dialog .grid-3, .modal-dialog .grid-2 {
    grid-template-columns: 1fr !important;
    gap: 0.5rem;
  }
  .stat-card { margin-bottom: 0.5rem; }
  .quick-actions-bar {
    overflow-x: auto;
    white-space: nowrap;
    flex-wrap: nowrap;
    padding-bottom: 0.5rem;
    -webkit-overflow-scrolling: touch;
  }
  .quick-actions-bar::-webkit-scrollbar { display: none; }

  /* Mobile Bottom App Bar */
  .mobile-bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-color);
    z-index: 99;
    align-items: center;
    justify-content: space-around;
    padding: 0 0.5rem;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
  }
  .mobile-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.68rem;
    font-weight: 700;
    gap: 2px;
    cursor: pointer;
    flex: 1;
    padding: 4px 0;
  }
  .mobile-nav-btn span.icon { font-size: 1.25rem; }
  .mobile-nav-btn.active { color: var(--primary); }
}

#printArea { display: none; }
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea {
    display: block !important; position: absolute; left: 0; top: 0; width: 100%;
    margin: 0; padding: 15mm; background: #FFF !important; color: #000 !important;
  }
}
</style>
</head>
<body>

<!-- LOGIN OVERLAY COMPONENT -->
<div class="login-screen-overlay" id="loginOverlay" style="display:none;">
  <div class="login-card">
    <div class="login-brand-header">
      <div class="login-brand-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
      </div>
      <h2 style="font-size:1.4rem; font-weight:900; margin:0; color:var(--text-main);">RENT CARS EGYPT</h2>
      <span style="font-size:0.8rem; color:var(--text-muted); margin-top:0.25rem;" id="loginSubText">نظام إدارة تأجير وتشغيل الأسطول والمخازن</span>
    </div>

    <div class="login-error-msg" id="loginErrorMsg">
      <span>⚠️</span>
      <span id="loginErrorText">اسم المستخدم أو كلمة المرور غير صحيحة!</span>
    </div>

    <form onsubmit="handleLoginSubmit(event)" id="loginForm">
      <div class="login-input-group">
        <label id="lblEmpName">اسم الموظف أو المستخدم</label>
        <div class="login-input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="loginEmpName" class="form-control" placeholder="اكتب اسم الموظف أو اسم المستخدم..." required value="" oninput="clearLoginErrors()">
        </div>
      </div>

      <div class="login-input-group">
        <label id="lblPassword">كلمة المرور</label>
        <div class="login-input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPassword" class="form-control" placeholder="اكتب كلمة المرور..." required value="" oninput="clearLoginErrors()">
        </div>
      </div>

      <div class="login-input-group">
        <label id="lblBranch">رقم وكود الفرع</label>
        <div class="login-input-wrap">
          <span class="input-icon">🏢</span>
          <input type="text" id="loginBranchCode" class="form-control" placeholder="مثال: فرع 001 أو 001" required value="" oninput="clearLoginErrors()">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width:100%; height:44px; font-size:0.95rem; margin-top:0.6rem; border-radius:10px;">
        <span id="btnEnterSystem">تسجيل الدخول للنظام 🚀</span>
      </button>

      <div style="display:flex; justify-content:center; align-items:center; margin-top:1.2rem; font-size:0.75rem; color:var(--text-muted);">
        <span>🔒 نظام موثق - يرجى إدخال بيانات حسابك المعتمدة</span>
      </div>
    </form>
  </div>
</div>

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="app-sidebar" id="appSidebar">
    <div class="sidebar-header">

      supabaseClient = window.supabase.createClient(cfg.url, cfg.key);
      console.log("Supabase Client Initialized Successfully!");

      console.warn("Supabase initialization error:", e);
      supabaseClient = null;
    }
  } else {
    supabaseClient = null;

}

    if (overlay) overlay.style.display = "flex";
    updateLoginTexts();
  } else {
    if (overlay) overlay.style.display = "none";
    applyUserSessionToUI();
  }
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  clearLoginErrors();

  const nameInput = document.getElementById("loginEmpName");
  const passInput = document.getElementById("loginPassword");
  const branchInput = document.getElementById("loginBranchCode");
  const submitBtn = document.getElementById("loginSubmitBtn");

  const name = nameInput.value.trim();
  const password = passInput.value.trim();
  const branch = branchInput.value.trim() || "فرع 001";

  if (!name || !password) {
    showLoginError(lang === 'ar' ? "يرجى كتابة اسم المستخدم وكلمة المرور" : "Please enter username and password", !name, !password);
    return;
  }

  // Set loading state on button
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>⏳</span> <span>${lang === 'ar' ? 'جارٍ التحقق...' : 'Authenticating...'}</span>`;
  }

  // 1. Check Supabase (Users / Employees table & Supabase Auth)
  if (supabaseClient) {
    try {
      // First try to check `users` or `employees` table in Supabase
      let { data: userRecord, error: tableError } = await supabaseClient
        .from('users')
        .select('*')
        .or(`username.eq.${name},email.eq.${name},name.eq.${name}`)
        .eq('password', password)
        .maybeSingle();

      // If `users` table was not found or empty, try `employees` table
      if (tableError || !userRecord) {
        const { data: empRecord } = await supabaseClient
          .from('employees')
          .select('*')
          .eq('name', name)
          .eq('password', password)
          .maybeSingle();
        userRecord = empRecord;
      }

      // If user matched in Supabase
      if (userRecord) {
        currentUserSession = {
          name: userRecord.name || userRecord.username || name,
          branch: userRecord.branch || branch,
          role: userRecord.role || "User / Employee",
          loginTime: new Date().toISOString(),
          source: "supabase"
        };
        localStorage.setItem("rc_user_session", JSON.stringify(currentUserSession));
        const overlay = document.getElementById("loginOverlay");
        if (overlay) overlay.style.display = "none";
        applyUserSessionToUI();
        navigate();
        resetSubmitBtn(submitBtn);
        return;
      }

      // Optional: If you use Supabase Auth Email & Password directly
      if (name.includes("@")) {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
          email: name,
          password: password
        });

        if (!authError && authData?.user) {
          currentUserSession = {
            name: authData.user.user_metadata?.name || authData.user.email.split("@")[0],
            branch: authData.user.user_metadata?.branch || branch,
            role: "Supabase Auth User",
            loginTime: new Date().toISOString(),
            source: "supabase_auth"
          };
          localStorage.setItem("rc_user_session", JSON.stringify(currentUserSession));
          const overlay = document.getElementById("loginOverlay");
          if (overlay) overlay.style.display = "none";
          applyUserSessionToUI();
          navigate();
          resetSubmitBtn(submitBtn);
          return;
        }
      }

    } catch (err) {
      console.warn("Supabase network error:", err);
    }
  }

  // 2. Strict Local / Fallback Credential Validation
  const customUsers = db.data.settings.customEmployees || [];
  
  // Master fallback user with car13 as approved default credentials
  const isMasterMatch = ((name === "car13" || name === "تجريبي3247") && password === "12345678");
  // Custom user matching
  const matchedCustomUser = customUsers.find(u => u.name === name && u.password === password);

  if (isMasterMatch || matchedCustomUser) {
    currentUserSession = {
      name: name,
      branch: branch,
      role: isMasterMatch ? "مدير الفرع المعتمد" : (matchedCustomUser.role || "موظف"),
      loginTime: new Date().toISOString(),
      source: isMasterMatch ? "verified_credentials" : "custom_db"
    };

    localStorage.setItem("rc_user_session", JSON.stringify(currentUserSession));
    const overlay = document.getElementById("loginOverlay");
    if (overlay) overlay.style.display = "none";

    applyUserSessionToUI();
    navigate();
    resetSubmitBtn(submitBtn);
    return;
  }

  // If wrong, highlight fields in RED & display visual error message
  resetSubmitBtn(submitBtn);
  showLoginError(
    lang === 'ar' ? "اسم المستخدم أو كلمة المرور غير صحيحة! يرجى التحقق من الخانات المحددة." : "Invalid username or password! Please verify the highlighted fields.",
    true,
    true
  );
}

function showLoginError(msg, errName = true, errPass = true) {
  const nameInput = document.getElementById("loginEmpName");
  const passInput = document.getElementById("loginPassword");
  const errBox = document.getElementById("loginErrorMsg");
  const errTxt = document.getElementById("loginErrorText");
  const formCard = document.querySelector(".login-card");

  if (errName && nameInput) nameInput.classList.add("input-error");
  if (errPass && passInput) passInput.classList.add("input-error");

  if (errTxt) errTxt.textContent = msg;
  if (errBox) errBox.style.display = "flex";

  if (formCard) {
    formCard.classList.remove("shake-anim");
    void formCard.offsetWidth; // Trigger reflow for animation
    formCard.classList.add("shake-anim");
  }
}

function clearLoginErrors() {
  const nameInput = document.getElementById("loginEmpName");
  const passInput = document.getElementById("loginPassword");
  const branchInput = document.getElementById("loginBranchCode");
  const errBox = document.getElementById("loginErrorMsg");

  if (nameInput) nameInput.classList.remove("input-error");
  if (passInput) passInput.classList.remove("input-error");
  if (branchInput) branchInput.classList.remove("input-error");
  if (errBox) errBox.style.display = "none";
}

function resetSubmitBtn(btn) {
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = `<span id="btnEnterSystem">${t("loginBtn")}</span>`;
  }
}

function logoutSession() {
  if (confirm(lang === 'ar' ? "هل تريد بالفعل تسجيل الخروج؟" : "Are you sure you want to log out?")) {
    currentUserSession = null;
    localStorage.removeItem("rc_user_session");
    checkAuthSession();
  }
}

function applyUserSessionToUI() {
  if (!currentUserSession) return;
  const nameEl = document.getElementById("userName");
  const branchBadge = document.getElementById("userBranchBadge");
  const topbarBranch = document.getElementById("topbarBranchIndicator");

  if (nameEl) nameEl.textContent = currentUserSession.name;
  if (branchBadge) branchBadge.textContent = currentUserSession.branch;
  if (topbarBranch) topbarBranch.textContent = "🏢 " + currentUserSession.branch.split(" ")[0];
}

function updateLoginTexts() {
  const subText = document.getElementById("loginSubText");
  const lblEmp = document.getElementById("lblEmpName");
  const lblPass = document.getElementById("lblPassword");
  const lblBranch = document.getElementById("lblBranch");
  const btnEnter = document.getElementById("btnEnterSystem");
  const topbarLogout = document.getElementById("topbarLogoutText");
  const sidebarLogout = document.getElementById("sidebarLogoutText");

  if (subText) subText.textContent = t("loginSub");
  if (lblEmp) lblEmp.textContent = t("empName");
  if (lblPass) lblPass.textContent = t("password");
  if (lblBranch) lblBranch.textContent = t("branchNo");
  if (btnEnter) btnEnter.textContent = t("loginBtn");
  if (topbarLogout) topbarLogout.textContent = t("logout");
  if (sidebarLogout) sidebarLogout.textContent = lang === 'ar' ? 'خروج' : 'Logout';
}

class Store {
  constructor() {
    this.data = this.load();
  }
  load() {
    try {
      const s = localStorage.getItem(DB_KEY);
      if (s) return JSON.parse(s);
    } catch(e) {}
    const fresh = buildInitialSeed();
    this.save(fresh);
    return fresh;
  }
  save(data = null) {
    if (data) this.data = data;
    localStorage.setItem(DB_KEY, JSON.stringify(this.data));
  }
  reset() {
    localStorage.removeItem(DB_KEY);
    this.data = buildInitialSeed();
    this.save(this.data);
  }
}

function renderNav() {
  const ul = document.getElementById("sidebarNav");
  ul.innerHTML = "";
  navItems.forEach(item => {
    const li = document.createElement("li");
    li.className = `nav-item ${route === item.id ? "active" : ""}`;
    
    // Fine alert counter badge
    let badgeHtml = "";
    if (item.id === "fines") {
      const unpaidCount = db.data.fines.filter(f => f.status === "unpaid").length;
      if (unpaidCount > 0) badgeHtml = `<span class="badge badge-danger">${unpaidCount}</span>`;
    } else if (item.id === "contracts") {
      const overdueCount = db.data.contracts.filter(c => c.status === "overdue").length;
      if (overdueCount > 0) badgeHtml = `<span class="badge badge-warning">${overdueCount}</span>`;
    }

    li.innerHTML = `
      <div class="nav-item-left">
        <span>${item.icon}</span>
        <span>${t(item.id)}</span>
      </div>
      ${badgeHtml}
    `;
    li.onclick = () => {
      route = item.id;
      renderNav();
      navigate();
      if (window.innerWidth <= 768) toggleSidebar();
    };
    ul.appendChild(li);
  });
}

function navigate() {
  document.getElementById("pageTitle").textContent = t(route);
  const container = document.getElementById("mainContent");
  container.innerHTML = "";

  switch(route) {

  openModal(
    lang === 'ar' ? `إدارة حالة العربية: ${veh.brand} ${veh.model} (${veh.plate})` : `Vehicle Status: ${veh.brand} ${veh.model} (${veh.plate})`,
    `
      <div style="display:flex; gap:1.2rem; align-items:center; background:var(--bg-subtle); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color); margin-bottom:1.25rem;">
        <img src="${veh.image}" alt="${veh.brand}" style="width:110px; height:75px; object-fit:cover; border-radius:8px; border:1px solid var(--border-color);" onerror="this.src='https://placehold.co/110x75/18233c/ffffff?text=${veh.brand}'">
        <div style="flex:1;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:1.1rem;">${veh.brand} ${veh.model} (${veh.year})</strong>

            <div style="font-size:0.75rem; color:var(--accent); font-weight:700; margin-top:0.3rem;">

            <small style="font-size:0.7rem; color:var(--text-muted);">${lang === 'ar' ? 'متاحة للتأجير الفوري' : 'Ready to rent'}</small>

        <div class="form-group">
          <label class="form-label">${lang === 'ar' ? 'تحديث السعر اليومي (ج.م)' : 'Daily Rental Rate (EGP)'}</label>

        </span>
        <div style="display:flex; gap:0.4rem;">
          ${veh.status === 'available' ? `
            <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal(); openCreateContractFor('${veh.id}');">${lang === 'ar' ? 'تحرير عقد إيجار' : 'New Contract'}</button>
          ` : ''}
          ${veh.status === 'rented' ? `
            <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal(); openReturnByVehId('${veh.id}');">${lang === 'ar' ? 'استلام وفحص' : 'Check-In'}</button>
          ` : ''}
          ${veh.status !== 'under_maintenance' ? `
            <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal(); openAddMaintModal();">${lang === 'ar' ? 'أمر صيانة' : 'Service Order'}</button>

      </div>

    () => {
      const selectedStatus = document.querySelector('input[name="quickStatus"]:checked')?.value || veh.status;
      const newMil = parseInt(document.getElementById("mQuickMil").value) || veh.mileage;
      const newDaily = parseFloat(document.getElementById("mQuickDaily").value) || veh.daily;

      // Update vehicle record
      veh.status = selectedStatus;
      veh.mileage = newMil;
      veh.daily = newDaily;

      // If user marks car available while having active contract, optionally prompt or update
      if (selectedStatus === "available" && currentContract) {
        currentContract.status = "completed";
      }

      db.save();
      closeModal();
      navigate();
    }
  );
}

function deleteVehicle(id) {
  if (confirm(t("confirmDel"))) {
    // Prevent delete if vehicle is rented
    const isRented = db.data.contracts.some(c => c.vehId === id && (c.status === "active" || c.status === "overdue"));
    if (isRented) {
      alert(lang === 'ar' ? "لا يمكن حذف عربية متأجرة حالياً في عقد نشط! يرجى إغلاق العقد أولاً." : "Cannot delete an actively rented vehicle! Please complete the contract first.");
      return;
    }
    db.data.vehicles = db.data.vehicles.filter(x => x.id !== id);
    db.save();
    navigate();
  }
}

    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label">${lang === 'ar' ? 'نسبة الخصم الممنوحة للعميل (%)' : 'Discount Percentage (%)'}</label>
        <input type="number" id="simDiscount" class="form-control" value="5" min="0" max="50" oninput="calcSim()">
      </div>
      <div class="form-group">
        <label class="form-label">${lang === 'ar' ? 'التكلفة التشغيلية التقديرية (زيت/استهلاك)' : 'Operating Overhead'}</label>
        <input type="number" id="simCost" class="form-control" value="150" readonly>
      </div>
    </div>
    <div style="background:var(--bg-subtle); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem; margin-top:0.5rem;">
      <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
        <span>${lang === 'ar' ? 'قيمة الإيجار قبل الضريبة:' : 'Gross Total:'}</span>
        <strong id="simGross">0 ج.م</strong>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
        <span>${lang === 'ar' ? 'ضريبة القيمة المضافة (14%):' : 'VAT (14%):'}</span>
        <strong id="simTax">0 ج.م</strong>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; padding-top:0.4rem; border-top:1px dashed var(--border-color); font-size:1.1rem; color:var(--primary);">
        <span>${lang === 'ar' ? 'الإجمالي المطلوب من العميل:' : 'Customer Total:'}</span>
        <strong id="simFinal">0 ج.م</strong>
      </div>
      <div style="display:flex; justify-content:space-between; color:var(--accent); font-weight:800; font-size:0.95rem;">
        <span>${lang === 'ar' ? 'صافي هامش الربح المتوقع للمكتب:' : 'Estimated Net Margin:'}</span>
        <strong id="simNetProfit">0 ج.م</strong>
      </div>
    </div>
  `, null, "");

  setTimeout(calcSim, 50);
}

function calcSim() {
  const rate = parseFloat(document.getElementById("simCat")?.value) || 1400;
  const days = parseInt(document.getElementById("simDays")?.value) || 1;
  const disc = parseFloat(document.getElementById("simDiscount")?.value) || 0;

  const base = rate * days;
  const discounted = base - (base * (disc / 100));
  const vat = discounted * 0.14;
  const total = discounted + vat;
  const netEstimate = (discounted * 0.72).toFixed(0);

  if (document.getElementById("simGross")) {
    document.getElementById("simGross").textContent = discounted.toLocaleString() + " " + t("curr");
    document.getElementById("simTax").textContent = vat.toFixed(2) + " " + t("curr");
    document.getElementById("simFinal").textContent = total.toFixed(2) + " " + t("curr");
    document.getElementById("simNetProfit").textContent = Number(netEstimate).toLocaleString() + " " + t("curr");
  }
}

  else alert("لا يوجد عقد نشط لهذه المركبة");

let activeReturnContract = null;

function updateReturnModalData(contractId) {
  const c = db.data.contracts.find(x => x.id === contractId);
  if (!c) return;
  activeReturnContract = c;
  const v = db.data.vehicles.find(x => x.id === c.vehId);

  const startMil = c.startMileage || (v ? v.mileage : 0);
  const container = document.getElementById("returnContractDetails");
  container.innerHTML = `
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; font-size:0.82rem;">
      <div><strong>المستأجر:</strong> ${c.custName}</div>
      <div><strong>المركبة:</strong> ${c.vehDesc}</div>
      <div><strong>تاريخ البدء:</strong> ${c.startDate}</div>
      <div><strong>تاريخ المفترض للإرجاع:</strong> ${c.endDate}</div>
    </div>
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; font-size:0.82rem; margin-top:0.4rem; padding-top:0.4rem; border-top:1px dashed var(--border-color);">
      <div><strong>عداد البداية:</strong> ${startMil.toLocaleString()} كم</div>
      <div><strong>المبلغ الإجمالي:</strong> ${c.total.toLocaleString()} ${t("curr")}</div>
      <div><strong>المدفوع مسبقاً:</strong> <span style="color:var(--accent); font-weight:700;">${c.paid.toLocaleString()} ${t("curr")}</span></div>
      <div><strong>المتبقي القديم:</strong> <span style="color:var(--danger); font-weight:700;">${c.remaining.toLocaleString()} ${t("curr")}</span></div>
    </div>
  `;

  const endMilInput = document.getElementById("mRetEndMileage");
  if (endMilInput) {
    endMilInput.value = startMil + (c.days * 220); // Estimation
  }
  calcReturnSettlement();
}

function calcReturnSettlement() {
  if (!activeReturnContract) return;
  const extra = parseFloat(document.getElementById("mRetExtraFee").value) || 0;
  const totalDue = (activeReturnContract.remaining || 0) + extra;
  const el = document.getElementById("mRetFinalPayable");
  if (el) el.textContent = totalDue.toLocaleString() + " " + t("curr");
}

function executeReturnProcess() {
  if (!activeReturnContract) return;
  const c = activeReturnContract;
  const v = db.data.vehicles.find(x => x.id === c.vehId);
  const endMileage = parseInt(document.getElementById("mRetEndMileage").value) || (v ? v.mileage : 0);
  const extra = parseFloat(document.getElementById("mRetExtraFee").value) || 0;
  const payMethod = document.getElementById("mRetPayMethod").value;
  const notes = document.getElementById("mRetNotes").value || "تم الاستلام بحالة جيدة";

  const totalRequired = c.remaining + extra;

  // 1. Update Vehicle
  if (v) {
    v.status = "available";
    if (endMileage > v.mileage) v.mileage = endMileage;
  }

  // 2. Update Contract
  c.status = "completed";
  c.paid = c.total + extra;
  c.remaining = 0;
  c.actualReturnDate = new Date().toISOString().split("T")[0];
  c.returnNotes = notes;

  // 3. Register Transaction & Receipt if money collected
  if (totalRequired > 0) {
    const txId = "TX-" + (db.data.transactions.length + 1);
    db.data.transactions.unshift({
      id: txId,
      date: new Date().toISOString().split("T")[0],
      type: "income",
      desc: `مخالصة واستلام نهائي للعقد ${c.id} (${c.custName})`,
      amount: totalRequired,
      method: payMethod
    });

    db.data.receipts.unshift({
      id: "RC-" + (db.data.receipts.length + 1),
      date: new Date().toISOString().split("T")[0],
      customer: c.custName,
      amount: totalRequired,
      method: payMethod,
      desc: `مخالصة نهائية وتسليم سيارة عقد ${c.id}`
    });
  }

  // 4. Record vehicle movement back to main office
  db.data.movements.unshift({
    id: "MV-" + (db.data.movements.length + 1),
    vehId: c.vehId,
    type: "استلام وإرجاع من عميل",
    from: "موقع العميل",
    to: "الفرع الرئيسي",
    date: new Date().toISOString().replace("T", " ").substring(0, 16),
    employee: "مسؤول الفحص والتسليم"
  });

  db.save();
  closeModal();
  navigate();
  alert("تم إرجاع المركبة بنجاح، وتحديث قراءة العداد وتصفية حساب العقد!");
}

    <div class="grid grid-3" style="background:var(--bg-subtle); padding:0.75rem; border-radius:8px; margin-bottom:1rem; border:1px solid var(--border-color);">
      <div>عدد الأيام: <strong id="mCntDays">7</strong></div>
      <div>ضريبة القيمة المضافة (14%): <strong id="mCntTax">0</strong> ج.م</div>
      <div>الإجمالي المطلوب: <strong id="mCntTotal" style="color:var(--primary);">0</strong> ج.م</div>
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label">المقدم المدفوع (العربون)</label>
        <input type="number" id="mCntPaid" class="form-control" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">طريقة الدفع</label>
        <select id="mCntMethod" class="form-control">
          <option value="كاش الخزنة">كاش في المعرض</option>
          <option value="انستاباي">انستاباي (InstaPay)</option>
          <option value="فودافون كاش">محفظة إلكترونية (فودافون كاش)</option>
          <option value="فيزا / ماستركارد">فيزا / ماستركارد (POS)</option>
          <option value="تحويل بنكي">تحويل بنكي مباشر</option>
        </select>
      </div>
    </div>
  `, () => {
    const custId = document.getElementById("mCntCust").value;
    const vehId = document.getElementById("mCntVeh").value;
    const cust = db.data.customers.find(x => x.id === custId);
    const veh = db.data.vehicles.find(x => x.id === vehId);

    const s = new Date(document.getElementById("mCntStart").value);
    const e = new Date(document.getElementById("mCntEnd").value);
    let days = Math.round((e - s) / 86400000);
    if (days <= 0) days = 1;

    const subtotal = days * veh.daily;
    const tax = subtotal * 0.14; // VAT in Egypt
    const total = subtotal + tax;
    const paid = parseFloat(document.getElementById("mCntPaid").value) || 0;
    const cid = "CNT-" + (db.data.contracts.length + 101);

    db.data.contracts.unshift({
      id: cid,
      custId: cust.id,
      custName: cust.name,
      vehId: veh.id,
      vehDesc: `${veh.brand} ${veh.model} (${veh.plate})`,
      startDate: document.getElementById("mCntStart").value,
      endDate: document.getElementById("mCntEnd").value,
      days,
      dailyRate: veh.daily,
      subtotal,
      tax,
      total,
      paid,
      remaining: Math.max(0, total - paid),
      startMileage: veh.mileage,
      status: "active"
    });

    veh.status = "rented";

    if (paid > 0) {
      db.data.transactions.unshift({
        id: "TX-" + (db.data.transactions.length + 1),
        date: document.getElementById("mCntStart").value,
        type: "income",
        desc: `دفعة مقدمة عقد إيجار ${cid}`,
        amount: paid,
        method: document.getElementById("mCntMethod").value
      });
      db.data.receipts.unshift({
        id: "RC-" + (db.data.receipts.length + 1),
        date: document.getElementById("mCntStart").value,
        customer: cust.name,
        amount: paid,
        method: document.getElementById("mCntMethod").value,
        desc: `عربون / مقدم إيجار لعقد ${cid}`
      });
    }

    db.data.authorizations.unshift({
      id: "AU-" + (db.data.authorizations.length + 1),
      contractId: cid,
      customer: cust.name,
      plate: veh.plate,
      start: document.getElementById("mCntStart").value,
      end: document.getElementById("mCntEnd").value,
      status: "active"
    });

    db.save();
    closeModal();
    navigate();
  }, "lg");

  setTimeout(calcContractModal, 100);
}

function calcContractModal() {
  const vEl = document.getElementById("mCntVeh");
  const sEl = document.getElementById("mCntStart");
  const eEl = document.getElementById("mCntEnd");
  if (!vEl || !sEl || !eEl) return;

  const opt = vEl.options[vEl.selectedIndex];
  const rate = parseFloat(opt ? opt.getAttribute("data-rate") : 1200) || 1200;
  const d1 = new Date(sEl.value);
  const d2 = new Date(eEl.value);
  let days = Math.round((d2 - d1) / 86400000);
  if (days <= 0) days = 1;

  const sub = days * rate;
  const tax = sub * 0.14;
  const tot = sub + tax;

  document.getElementById("mCntDays").textContent = days;
  document.getElementById("mCntTax").textContent = tax.toFixed(2);
  document.getElementById("mCntTotal").textContent = tot.toFixed(2);
}

function deleteContract(id) {
  if (confirm(t("confirmDel"))) {
    const c = db.data.contracts.find(x => x.id === id);
    if (c && (c.status === "active" || c.status === "overdue")) {
      const v = db.data.vehicles.find(x => x.id === c.vehId);
      if (v) v.status = "available";
    }
    db.data.contracts = db.data.contracts.filter(x => x.id !== id);
    db.save();
    navigate();
  }
}

function onNationalityChange(natValue) {
  const natSelect = document.getElementById("mCNationality");
  const codeSelect = document.getElementById("mCCountryCode");
  const passCountryInput = document.getElementById("mCPassIssueCountry");
  if (!natSelect || !codeSelect) return;

  const opt = natSelect.options[natSelect.selectedIndex];
  const dialCode = opt ? opt.getAttribute("data-code") : null;
  const countryName = opt ? opt.getAttribute("data-country") : "";

  if (dialCode) {
    codeSelect.value = dialCode;
  }
  if (passCountryInput && countryName && !passCountryInput.value) {
    passCountryInput.value = countryName;
  }
}

function toggleCustFields(kind) {
  const nidGrp = document.getElementById("nidGroup");
  const passNumGrp = document.getElementById("passNumGroup");
  const touristBox = document.getElementById("touristDetailsBox");
  const natSelect = document.getElementById("mCNationality");
  const codeSelect = document.getElementById("mCCountryCode");

  if (kind === "tourist") {
    if (nidGrp) nidGrp.style.display = "none";
    if (passNumGrp) passNumGrp.style.display = "block";
    if (touristBox) touristBox.style.display = "block";
    if (natSelect && natSelect.value.includes("مصري")) {
      // Default to British or first international option
      const foreignOpt = Array.from(natSelect.options).find(o => o.value.includes("British") || o.value.includes("American"));
      if (foreignOpt) {
        natSelect.value = foreignOpt.value;
        onNationalityChange(foreignOpt.value);
      }
    }
  } else {
    if (nidGrp) nidGrp.style.display = "block";
    if (passNumGrp) passNumGrp.style.display = "none";
    if (touristBox) touristBox.style.display = "none";
    if (natSelect) {
      const egOpt = Array.from(natSelect.options).find(o => o.value.includes("مصري") || o.value.includes("Egyptian"));
      if (egOpt) {
        natSelect.value = egOpt.value;
        if (codeSelect) codeSelect.value = "+20";
      }
    }
  }
}

function openAddAuthorizationModal() {

      <label class="form-label">${lang === 'ar' ? 'اختر عقد الإيجار' : 'Select Rental Contract'}</label>

      </select>
    </div>
    <div class="grid grid-2">

      </div>

      </div>
    </div>

    const cid = document.getElementById("mAuthContract").value;

    const start = document.getElementById("mAuthStart").value;
    const end = document.getElementById("mAuthEnd").value;

    if (!cust || !plate) {
      alert(lang === 'ar' ? "يرجى إكمال البيانات" : "Please complete all fields");
      return;
    }

    const aid = "AU-" + (db.data.authorizations.length + 1);
    db.data.authorizations.unshift({
      id: aid,
      contractId: cid,
      customer: cust,
      plate: plate,
      start: start,
      end: end,
      status: "active"
    });

    db.save();
    closeModal();
    navigate();
  });

  setTimeout(() => {
    if (activeContracts[0]) autoFillAuthData(activeContracts[0].id);
  }, 50);
}

function autoFillAuthData(cid) {
  const c = db.data.contracts.find(x => x.id === cid);
  if (!c) return;
  const custInput = document.getElementById("mAuthCust");
  const plateInput = document.getElementById("mAuthPlate");
  const startInput = document.getElementById("mAuthStart");
  const endInput = document.getElementById("mAuthEnd");

  if (custInput) custInput.value = c.custName;
  if (startInput) startInput.value = c.startDate;
  if (endInput) endInput.value = c.endDate;
  const v = db.data.vehicles.find(x => x.id === c.vehId);
  if (plateInput) plateInput.value = v ? v.plate : "";
}

      <label class="form-label">التكلفة (ج.م)</label>
      <input type="number" id="mMCost" class="form-control" value="850">
    </div>
  `, () => {
    const vid = document.getElementById("mMVeh").value;
    const v = db.data.vehicles.find(x => x.id === vid);
    const cost = parseFloat(document.getElementById("mMCost").value) || 0;
    const mid = "M-" + (db.data.maintenance.length + 1);

    db.data.maintenance.unshift({
      id: mid,
      vehId: vid,
      plate: v.plate,
      type: document.getElementById("mMType").value,
      workshop: document.getElementById("mMShop").value,
      cost,
      date: new Date().toISOString().split("T")[0],
      status: "in_progress"
    });

    v.status = "under_maintenance";
    if (v.nextOilChange) v.nextOilChange = v.mileage + 5000;

    db.data.expenses.unshift({
      id: "EX-" + (db.data.expenses.length + 1),
      date: new Date().toISOString().split("T")[0],
      title: `صيانة مركبة ${v.plate}`,
      category: "Maintenance",
      amount: cost,
      method: "كاش الخزنة"
    });

    db.save();
    closeModal();
    navigate();
  });

function completeMaint(id) {
  const m = db.data.maintenance.find(x => x.id === id);
  if (!m) return;
  m.status = "completed";
  const v = db.data.vehicles.find(x => x.id === m.vehId);
  if (v) v.status = "available";
  db.save();
  navigate();
}

function exportDataCSV() {
  let csv = "\uFEFFرقم العقد,العميل,المركبة,الإجمالي,المدفوع,المتبقي,الحالة\n";
  db.data.contracts.forEach(c => {
    csv += `"${c.id}","${c.custName}","${c.vehDesc}","${c.total}","${c.paid}","${c.remaining}","${c.status}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Contracts_Report.csv";
  a.click();
}

function saveSupabaseConfig() {
  const url = document.getElementById("supaUrl").value.trim();
  const key = document.getElementById("supaKey").value.trim();

  if (!url || !key) {
    alert(lang === 'ar' ? "يرجى كتابة Project URL و Anon Key الخاصة بسوبابيز" : "Please provide both Supabase Project URL and Public Anon Key");
    return;
  }

  localStorage.setItem("rc_supabase_config", JSON.stringify({ url, key }));
  initSupabase();

  if (supabaseClient) {
    alert(lang === 'ar' ? "✅ تم حفظ بيانات سوبابيز وتهيئة الاتصال بنجاح!" : "✅ Supabase Config Saved & Initialized Successfully!");
  } else {
    alert(lang === 'ar' ? "⚠️ تم الحفظ ولكن يرجى التأكد من صحة الرابط ومفتاح API" : "⚠️ Saved, but please verify URL and API Key syntax");
  }
  navigate();
}

function disconnectSupabase() {
  if (confirm(lang === 'ar' ? "هل تريد إزالة ربط سوبابيز والعودة للتخزين المحلي؟" : "Disconnect Supabase and switch back to Local Mode?")) {
    localStorage.removeItem("rc_supabase_config");
    supabaseClient = null;
    navigate();
  }
}

function openSupabaseSqlHelper() {
  const sql = `-- 1. كود إنشاء جدول المستخدمين (users) في Supabase SQL Editor
create table if not exists public.users (
  id uuid default gen_random_uuid() primary key,
  username text not null unique,
  name text,
  email text,
  password text not null,
  branch text default 'فرع 001',
  role text default 'موظف تأجير واستقبال',
  created_at timestamp with time zone default timezone('utc'::text, now()) not null
);

-- تفعيل سياسة الحماية (RLS)
alter table public.users enable row level security;

-- حذف السياسة القديمة إن وجدت ثم إنشاؤها بأمان للقراءة
drop policy if exists "Allow read access to all" on public.users;
create policy "Allow read access to all" on public.users for select using (true);

-- 2. إدراج المستخدم المعتمد وتحديثه تلقائياً
insert into public.users (username, name, password, branch, role)
values 
  ('car13', 'car13', '12345678', 'فرع 001', 'مدير الفرع المعتمد')
on conflict (username) do update 
set password = excluded.password, branch = excluded.branch;`;

        <div class="form-group">
          <label class="form-label">${lang === 'ar' ? 'كلمة المرور المخصصة' : 'Custom Password'}</label>
          <input type="text" id="mNewEmpPass" class="form-control" required placeholder="مثال: Cairo#2026">
        </div>
        <div class="form-group">
          <label class="form-label">${lang === 'ar' ? 'المسمى الوظيفي / الصلاحية' : 'Role / Privilege'}</label>
          <input type="text" id="mNewEmpRole" class="form-control" value="${lang === 'ar' ? 'موظف استقبال وتأجير' : 'Rental Agent'}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">${lang === 'ar' ? 'الفرع المخصص' : 'Branch Assignment'}</label>
        <select id="mNewEmpBranch" class="form-control">
          <option value="BR-01 (فرع المهندسين - الرئيسي)">فرع 01 - المهندسين (الرئيسي)</option>
          <option value="BR-02 (فرع مطار القاهرة - صالة 3)">فرع 02 - مطار القاهرة الدولي (صالة 3)</option>
          <option value="BR-03 (فرع مدينة نصر - عباس العقاد)">فرع 03 - مدينة نصر (عباس العقاد)</option>
          <option value="BR-04 (فرع التجمع الخامس - التسعين)">فرع 04 - التجمع الخامس (شارع التسعين)</option>
          <option value="BR-05 (فرع الشيخ زايد - وصلة دهشور)">فرع 05 - الشيخ زايد (وصلة دهشور)</option>
          <option value="BR-06 (فرع الإسكندرية - سموحة)">فرع 06 - الإسكندرية (سموحة)</option>
        </select>
      </div>
      <p style="font-size:0.75rem; color:var(--text-muted);">
        ${lang === 'ar' ? '💡 سيتم حفظ الحساب محلياً في الإعدادات، وإذا كان سوبابيز متصلاً فسيتم إضافته سحابياً أيضاً.' : '💡 Account will be stored locally, and pushed to Supabase if connected.'}
      </p>
    `,
    async () => {
      const name = document.getElementById("mNewEmpName").value.trim();
      const pass = document.getElementById("mNewEmpPass").value.trim();
      const role = document.getElementById("mNewEmpRole").value.trim();
      const branch = document.getElementById("mNewEmpBranch").value;

      if (!name || !pass) {
        alert(lang === 'ar' ? "يرجى كتابة اسم الموظف وكلمة المرور" : "Please fill in name and password");
        return;
      }

      if (!db.data.settings.customEmployees) {
        db.data.settings.customEmployees = [];
      }

      const newEmp = { name, password: pass, role, branch };
      db.data.settings.customEmployees.push(newEmp);
      db.save();

      // If Supabase is connected, push to Supabase table
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('employees')
            .upsert([newEmp], { onConflict: 'name' });
          if (error) console.warn("Supabase employee push warning:", error);
        } catch (e) {
          console.warn(e);
        }
      }

      closeModal();
      navigate();
      alert(lang === 'ar' ? "تمت إضافة الموظف وكلمة المرور بنجاح!" : "Employee credentials created successfully!");
    }
  );
}

function deleteCustomEmployee(index) {
  if (confirm(t("confirmDel"))) {
    db.data.settings.customEmployees.splice(index, 1);
    db.save();
    navigate();
  }
}

function saveSettings() {
  db.data.settings.companyName = document.getElementById("sCompName").value;
  db.data.settings.cr = document.getElementById("sCr").value;
  db.data.settings.vat = document.getElementById("sVat").value;
  db.data.settings.phone = document.getElementById("sPhone").value;
  db.save();
  alert("تم حفظ الإعدادات بنجاح!");
}

function exportBackupJSON() {
  const blob = new Blob([JSON.stringify(db.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rent_cars_backup.json";
  a.click();
}

function importBackupJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (parsed.vehicles && parsed.contracts) {
        db.save(parsed);
        alert("تمت استعادة البيانات بنجاح!");
        location.reload();
      } else {
        alert("الملف غير متوافق!");
      }
    } catch(err) {
      alert("خطأ في قراءة ملف النسخة الاحتياطية");
    }
  };
  reader.readAsText(file);
}

function resetAllDemo() {
  if (confirm("هل تريد بالفعل مسح التعديلات والعودة للبيانات الافتراضية؟")) {
    db.reset();
    location.reload();
  }
}

// ==================== MODAL HELPER ====================
function openModal(title, bodyHtml, onSubmit, size = "") {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHtml;
  document.getElementById("modalDialog").className = "modal-dialog " + size;
  const btn = document.getElementById("modalSubmitBtn");
  if (onSubmit) {
    btn.style.display = "inline-flex";
    btn.onclick = onSubmit;
  } else {
    btn.style.display = "none";
  }
  document.getElementById("modalBackdrop").classList.add("show");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("show");
}

document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeModal();
});

// ==================== THEME & LANGUAGE ====================
function toggleTheme() {
  theme = theme === "light" ? "dark" : "light";
  document.body.setAttribute("data-theme", theme);
  localStorage.setItem("rc_theme", theme);
}

function toggleLanguage() {
  lang = lang === "ar" ? "en" : "ar";
  localStorage.setItem("rc_lang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.body.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = lang === "ar" ? "EN" : "عربي";
  updateLoginTexts();
  renderNav();
  navigate();
}

function toggleSidebar() {
  document.getElementById("appSidebar").classList.toggle("open");
}

function handleGlobalSearch(val) {
  if (!val) return;
  if (route !== "vehicles" && route !== "contracts" && route !== "customers") {
    route = "vehicles";
    renderNav();
    navigate();
    const filterInput = document.querySelector(".filter-bar input");
    if (filterInput) {
      filterInput.value = val;
      filterVehiclesTable(val);
    }
  }
}

// Global Shortcuts
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    const s = document.getElementById("globalSearch");
    if (s) s.focus();
  }
  if (e.key === "Escape") closeModal();
});

// INITIALIZE
document.body.setAttribute("data-theme", theme);
document.documentElement.lang = lang;
document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
document.body.dir = lang === "ar" ? "rtl" : "ltr";
document.getElementById("langBtn").textContent = lang === "ar" ? "EN" : "عربي";
initSupabase();
checkAuthSession();
renderNav();
navigate();
</script>
